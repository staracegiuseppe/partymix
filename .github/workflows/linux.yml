# Builds PartyMix for Linux (x86_64): an AppImage and a .deb, on Ubuntu 22.04 so they also run on older distributions.
# Started only by hand (Actions → «Linux» → Run workflow). With a release tag (for example v1.6.3) it also attaches the
# two files to that GitHub release; otherwise they are only kept as the run's artifacts.
name: Linux

on:
  # also on each push to the linux-build branch, to try the build before it reaches main
  push:
    branches: [linux-build]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release a cui allegare AppImage e .deb (es. v1.6.3). Vuoto = solo artefatti della run."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (WebKitGTK, ALSA for the ad detector, AppImage tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libdbus-1-dev libasound2-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential pkg-config file patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        run: npx vitest run

      - name: Build AppImage and .deb
        run: npx tauri build --bundles appimage,deb

      - name: Collect the files
        id: files
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/PartyMix_${V}_linux-x86_64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "out/PartyMix_${V}_linux-amd64.deb"
          ls -l out
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: PartyMix-${{ steps.files.outputs.version }}-linux
          path: out/*

      - name: Attach to the release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: gh release upload "$TAG" out/* --clobber
