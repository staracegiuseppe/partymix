# PartyMix server with Docker (Synology Container Manager, QNAP Container Station, Unraid, TrueNAS, any Linux).
# Synology: Container Manager → Progetto → Crea → percorso della cartella «server» → usa questo file.
# Prima: crea la cartella condivisa PartyMix e sostituisci qui sotto i tre valori segnati con «←».
services:
  partymix-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: partymix-server:latest
    container_name: partymix-server
    restart: unless-stopped
    # Rete dell'host: il server vede l'indirizzo vero di chi si collega (così rifiuta chi arriva da internet)
    # e, su Synology, raggiunge DSM per far entrare gli utenti del NAS.
    network_mode: host
    # ← l'utente del NAS proprietario della cartella PartyMix, come «uid:gid» (via SSH: `id nomeutente`)
    user: "1000:100"
    environment:
      PARTYMIX_ROOT: /PartyMix
      PORT: "8788"
      # Mai "1" senza VPN: aprirebbe la libreria a internet.
      PARTYMIX_ALLOW_PUBLIC: "0"
      # Solo Synology: gli utenti del NAS entrano con nome e password di DSM. Altrove togli queste due righe.
      PARTYMIX_DSM_URL: http://127.0.0.1:5000/webapi/entry.cgi
      PARTYMIX_GROUP_FILE: /host/group
    volumes:
      # ← la cartella condivisa PartyMix del NAS (Synology: /volume1/PartyMix, QNAP: /share/PartyMix, Unraid: /mnt/user/PartyMix)
      - /volume1/PartyMix:/PartyMix
      # ← solo Synology: per sapere chi è amministratore del NAS (togli la riga altrove)
      - /etc/group:/host/group:ro
